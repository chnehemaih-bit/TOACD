<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Analysis — AI Syntax Diagnostics</title>
    <meta name="description" content="Performance analysis dashboard for the AI Syntax Diagnostic Engine showing detection metrics, code complexity analysis, and fix success rates.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --bg-card-hover: #263548;
            --border: #334155;
            --border-light: rgba(51, 65, 85, 0.5);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --accent-secondary: #38bdf8;
            --accent-secondary-glow: rgba(56, 189, 248, 0.15);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Subtle gradient background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(56, 189, 248, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── HEADER ── */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--accent-secondary), transparent);
            opacity: 0.4;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            width: 34px; height: 34px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .header-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            font-family: inherit;
        }

        .back-btn:hover {
            color: var(--text-primary);
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        /* ── VIEW TOGGLE ── */
        .view-toggle {
            display: flex;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .view-toggle-btn {
            padding: 7px 16px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            letter-spacing: 0.01em;
        }

        .view-toggle-btn:hover {
            color: var(--text-secondary);
        }

        .view-toggle-btn.active {
            background: var(--accent);
            color: #fff;
        }

        /* ── MAIN ── */
        .main {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 28px 24px 64px;
        }

        /* ── SECTION TITLE ── */
        .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 16px;
            padding-left: 2px;
        }

        /* ── STAT CARDS ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }

        @media (max-width: 1000px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px 20px;
            transition: all 0.25s ease;
            position: relative;
        }

        .stat-card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1;
            color: var(--text-primary);
        }

        .stat-unit {
            font-size: 13px;
            font-weight: 500;
            margin-left: 2px;
            color: var(--text-secondary);
        }

        .stat-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
            position: relative;
            top: -1px;
        }

        /* ── CHART GRID ── */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (max-width: 900px) {
            .charts-grid { grid-template-columns: 1fr; }
        }

        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px 24px;
            transition: all 0.25s ease;
        }

        .chart-card:hover {
            border-color: rgba(99, 102, 241, 0.2);
        }

        .chart-card.full-width {
            grid-column: 1 / -1;
        }

        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .chart-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .chart-badge {
            font-size: 11px;
            padding: 3px 9px;
            border-radius: 6px;
            font-weight: 600;
            background: var(--accent-glow);
            color: var(--accent-light);
            border: 1px solid rgba(99, 102, 241, 0.15);
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 280px;
        }

        .chart-container.tall {
            height: 320px;
        }

        .chart-container.short {
            height: 240px;
        }

        /* ── VIEW PANELS ── */
        .view-panel {
            display: none;
        }

        .view-panel.active {
            display: block;
        }

        /* ── COMPLEXITY PILLS ── */
        .complexity-legend {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .complexity-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-secondary);
        }

        .complexity-pill .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
        }

        /* ── DETAIL TABLE ── */
        .detail-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .detail-table th {
            text-align: left;
            padding: 10px 14px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border-bottom: 1px solid var(--border);
            background: var(--bg-primary);
        }

        .detail-table td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-primary);
        }

        .detail-table tr:hover td {
            background: rgba(99, 102, 241, 0.03);
        }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            font-family: 'Inter', monospace;
        }

        .tag-error   { background: rgba(239, 68, 68, 0.12); color: var(--danger); }
        .tag-success { background: rgba(34, 197, 94, 0.12); color: var(--success); }
        .tag-warning { background: rgba(245, 158, 11, 0.12); color: var(--warning); }
        .tag-info    { background: var(--accent-glow); color: var(--accent-light); }

        /* ── RATE BAR ── */
        .rate-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.04);
            border-radius: 2px;
            overflow: hidden;
        }

        .rate-bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.8s ease;
        }

        /* ── EMPTY STATE ── */
        .empty-state {
            text-align: center;
            padding: 100px 20px;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 20px;
            opacity: 0.4;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-msg {
            font-size: 14px;
            color: var(--text-secondary);
            max-width: 420px;
            margin: 0 auto 24px;
            line-height: 1.7;
        }

        .run-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .run-btn:hover {
            background: var(--accent-light);
            transform: translateY(-1px);
        }

        /* ── TIMESTAMP ── */
        .timestamp-bar {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        /* ── ANIMATIONS ── */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .anim {
            animation: fadeIn 0.4s ease forwards;
            opacity: 0;
        }

        .anim:nth-child(1) { animation-delay: 0.05s; }
        .anim:nth-child(2) { animation-delay: 0.08s; }
        .anim:nth-child(3) { animation-delay: 0.11s; }
        .anim:nth-child(4) { animation-delay: 0.14s; }
        .anim:nth-child(5) { animation-delay: 0.17s; }

        .chart-anim {
            animation: fadeIn 0.45s ease forwards;
            opacity: 0;
        }
        .chart-anim:nth-child(1) { animation-delay: 0.2s; }
        .chart-anim:nth-child(2) { animation-delay: 0.25s; }
        .chart-anim:nth-child(3) { animation-delay: 0.3s; }
        .chart-anim:nth-child(4) { animation-delay: 0.35s; }
        .chart-anim:nth-child(5) { animation-delay: 0.4s; }
        .chart-anim:nth-child(6) { animation-delay: 0.45s; }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
    <div class="header-left">
        <div class="header-icon">📊</div>
        <div>
            <div class="header-title">Performance Analysis</div>
            <div class="header-subtitle">AI Syntax Diagnostic Engine</div>
        </div>
    </div>
    <div class="header-right">
        <div class="view-toggle" id="view-toggle">
            <button class="view-toggle-btn active" data-view="overview" id="btn-overview">Overview</button>
            <button class="view-toggle-btn" data-view="complexity" id="btn-complexity">Code Complexity</button>
        </div>
        <a href="/" class="back-btn">← Terminal</a>
    </div>
</div>

<!-- MAIN -->
<div class="main" id="main-content">
    <!-- Content injected by JS -->
</div>

<script>
    // ── Minimal color palette ──
    const C = {
        primary:     '#6366f1',
        primaryFill: 'rgba(99, 102, 241, 0.18)',
        primaryLight:'#818cf8',
        secondary:   '#38bdf8',
        secondaryFill:'rgba(56, 189, 248, 0.18)',
        muted:       '#475569',
        mutedFill:   'rgba(71, 85, 105, 0.3)',
        grid:        'rgba(51, 65, 85, 0.4)',
    };

    // Chart.js global
    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = 'rgba(51, 65, 85, 0.5)';
    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.font.size = 11;

    let currentView = 'overview';
    let loadedData = null;

    // ── Toggle Views ──
    document.querySelectorAll('.view-toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.view-toggle-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentView = btn.dataset.view;
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(`panel-${currentView}`);
            if (target) target.classList.add('active');
        });
    });

    // ── Load data ──
    async function loadPerformanceData() {
        try {
            const res = await fetch('/performance-data');
            if (!res.ok) throw new Error('No data');
            const data = await res.json();
            if (!data || !data.history || data.history.length === 0) {
                showEmpty();
                return;
            }
            loadedData = data;
            renderDashboard(data);
        } catch (e) {
            showEmpty();
        }
    }

    function showEmpty() {
        document.getElementById('main-content').innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">📊</div>
                <div class="empty-title">No Performance Data Yet</div>
                <div class="empty-msg">Run a diagnostic on a C++ file from the terminal to start collecting performance metrics.</div>
                <a href="/" class="run-btn">← Go to Terminal</a>
            </div>
        `;
        document.getElementById('view-toggle').style.display = 'none';
    }

    function renderDashboard(data) {
        const { summary, history, file_stats } = data;
        const container = document.getElementById('main-content');

        const totalRuns = summary.total_runs;
        const totalErrors = summary.total_errors;
        const avgConfidence = summary.avg_confidence.toFixed(1);
        const avgDetectionTime = (summary.avg_detection_time * 1000).toFixed(1);
        const fixesApplied = summary.fixes_applied;
        const successRate = totalRuns > 0 ? ((summary.successful_compilations / totalRuns) * 100).toFixed(0) : 0;

        // Aggregate
        const errorCounts = {};
        const fixSuccessMap = {};
        const confidenceByType = {};
        const perFileData = {};
        const timelineLabels = [];
        const timelineConfidence = [];
        const timelineDetection = [];

        history.forEach((entry, idx) => {
            const label = entry.error_type || 'UNKNOWN';
            errorCounts[label] = (errorCounts[label] || 0) + 1;

            if (entry.fix_attempted) {
                if (!fixSuccessMap[label]) fixSuccessMap[label] = { success: 0, total: 0 };
                fixSuccessMap[label].total++;
                if (entry.fix_compiled) fixSuccessMap[label].success++;
            }

            if (!confidenceByType[label]) confidenceByType[label] = [];
            confidenceByType[label].push(entry.confidence);

            const fname = entry.filename || 'unknown';
            if (!perFileData[fname]) perFileData[fname] = { runs: 0, totalConf: 0, totalTime: 0, fixes: 0, fixSuccess: 0 };
            perFileData[fname].runs++;
            perFileData[fname].totalConf += entry.confidence;
            perFileData[fname].totalTime += entry.detection_time * 1000;
            if (entry.fix_attempted) perFileData[fname].fixes++;
            if (entry.fix_compiled) perFileData[fname].fixSuccess++;

            timelineLabels.push(`#${idx + 1}`);
            timelineConfidence.push(entry.confidence);
            timelineDetection.push(entry.detection_time * 1000);
        });

        // Complexity grouping
        const complexityGroups = { simple: [], medium: [], complex: [] };
        history.forEach(entry => {
            const fname = entry.filename;
            const stats = file_stats && file_stats[fname];
            const complexity = stats ? stats.complexity : 'simple';
            complexityGroups[complexity].push(entry);
        });

        container.innerHTML = `
            <!-- ═══ OVERVIEW PANEL ═══ -->
            <div class="view-panel active" id="panel-overview">

                <!-- STAT CARDS -->
                <div class="stats-grid">
                    <div class="stat-card anim">
                        <div class="stat-label">Total Analyses</div>
                        <div class="stat-value">${totalRuns}</div>
                    </div>
                    <div class="stat-card anim">
                        <div class="stat-label">Errors Detected</div>
                        <div class="stat-value">${totalErrors}</div>
                    </div>
                    <div class="stat-card anim">
                        <div class="stat-label">Avg Confidence</div>
                        <div class="stat-value">${avgConfidence}<span class="stat-unit">%</span></div>
                    </div>
                    <div class="stat-card anim">
                        <div class="stat-label">Avg Detection</div>
                        <div class="stat-value">${avgDetectionTime}<span class="stat-unit">ms</span></div>
                    </div>
                    <div class="stat-card anim">
                        <div class="stat-label">Fix Success</div>
                        <div class="stat-value">${successRate}<span class="stat-unit">%</span></div>
                    </div>
                </div>

                <!-- CHARTS -->
                <div class="charts-grid">

                    <!-- Error Type Distribution - Horizontal Bar -->
                    <div class="chart-card chart-anim">
                        <div class="chart-header">
                            <div class="chart-title">Error Type Distribution</div>
                            <div class="chart-badge">${Object.keys(errorCounts).length} types</div>
                        </div>
                        <div class="chart-container">
                            <canvas id="chart-error-dist"></canvas>
                        </div>
                    </div>

                    <!-- Per-File Performance - Bar -->
                    <div class="chart-card chart-anim">
                        <div class="chart-header">
                            <div class="chart-title">Per-File Detection Time</div>
                            <div class="chart-badge">${Object.keys(perFileData).length} files</div>
                        </div>
                        <div class="chart-container">
                            <canvas id="chart-per-file"></canvas>
                        </div>
                    </div>

                    <!-- Detection Timeline - Line Chart -->
                    <div class="chart-card chart-anim full-width">
                        <div class="chart-header">
                            <div class="chart-title">Detection Performance Timeline</div>
                            <div class="chart-badge">${history.length} runs</div>
                        </div>
                        <div class="chart-container tall">
                            <canvas id="chart-timeline"></canvas>
                        </div>
                    </div>

                    <!-- Confidence by Error Type - Bar -->
                    <div class="chart-card chart-anim">
                        <div class="chart-header">
                            <div class="chart-title">Confidence by Error Type</div>
                            <div class="chart-badge">ML Model</div>
                        </div>
                        <div class="chart-container">
                            <canvas id="chart-confidence"></canvas>
                        </div>
                    </div>

                    <!-- Fix Success Rate - Bar -->
                    <div class="chart-card chart-anim">
                        <div class="chart-header">
                            <div class="chart-title">Auto-Fix Success Rate</div>
                            <div class="chart-badge">${fixesApplied} attempts</div>
                        </div>
                        <div class="chart-container">
                            <canvas id="chart-fix-rate"></canvas>
                        </div>
                    </div>
                </div>

                <!-- HISTORY TABLE -->
                <div class="chart-card chart-anim">
                    <div class="chart-header">
                        <div class="chart-title">Run History</div>
                        <div class="chart-badge">${history.length} entries</div>
                    </div>
                    <div style="overflow-x:auto;">
                        <table class="detail-table" id="history-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>File</th>
                                    <th>Error Type</th>
                                    <th>Confidence</th>
                                    <th>Detection</th>
                                    <th>Fix</th>
                                    <th>Compiled</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <div class="timestamp-bar">
                    Analysis generated at ${new Date().toLocaleString()} · AI Syntax Diagnostic Engine
                </div>
            </div>

            <!-- ═══ COMPLEXITY PANEL ═══ -->
            <div class="view-panel" id="panel-complexity">

                <div class="section-title">Code Complexity Analysis</div>

                <div class="complexity-legend">
                    <div class="complexity-pill"><span class="dot" style="background:${C.primary}"></span> Simple Code (≤8 lines, ≤1 control)</div>
                    <div class="complexity-pill"><span class="dot" style="background:${C.secondary}"></span> Medium Code (≤20 lines, ≤3 controls)</div>
                    <div class="complexity-pill"><span class="dot" style="background:${C.muted}"></span> Complex Code (>20 lines, >3 controls)</div>
                </div>

                <div class="charts-grid">
                    <!-- Complexity: Detection Time -->
                    <div class="chart-card chart-anim">
                        <div class="chart-header">
                            <div class="chart-title">Avg Detection Time by Complexity</div>
                            <div class="chart-badge">milliseconds</div>
                        </div>
                        <div class="chart-container short">
                            <canvas id="chart-cx-time"></canvas>
                        </div>
                    </div>

                    <!-- Complexity: Confidence -->
                    <div class="chart-card chart-anim">
                        <div class="chart-header">
                            <div class="chart-title">Avg Confidence by Complexity</div>
                            <div class="chart-badge">percentage</div>
                        </div>
                        <div class="chart-container short">
                            <canvas id="chart-cx-conf"></canvas>
                        </div>
                    </div>

                    <!-- Complexity: Fix Success Rate -->
                    <div class="chart-card chart-anim full-width">
                        <div class="chart-header">
                            <div class="chart-title">Fix Success Rate by Complexity</div>
                            <div class="chart-badge">auto-heal</div>
                        </div>
                        <div class="chart-container short">
                            <canvas id="chart-cx-fix"></canvas>
                        </div>
                    </div>

                    <!-- Per-File Breakdown with Complexity -->
                    <div class="chart-card chart-anim full-width">
                        <div class="chart-header">
                            <div class="chart-title">Per-File Performance Comparison</div>
                            <div class="chart-badge">all files</div>
                        </div>
                        <div class="chart-container tall">
                            <canvas id="chart-cx-files"></canvas>
                        </div>
                    </div>

                    <!-- Complexity: Line Count vs Detection Time (Scatter-Line) -->
                    <div class="chart-card chart-anim full-width">
                        <div class="chart-header">
                            <div class="chart-title">Code Lines vs Detection Time</div>
                            <div class="chart-badge">correlation</div>
                        </div>
                        <div class="chart-container">
                            <canvas id="chart-cx-scatter"></canvas>
                        </div>
                    </div>
                </div>

                <!-- File Complexity Table -->
                <div class="chart-card chart-anim">
                    <div class="chart-header">
                        <div class="chart-title">File Complexity Breakdown</div>
                        <div class="chart-badge">${file_stats ? Object.keys(file_stats).length : 0} files</div>
                    </div>
                    <div style="overflow-x:auto;">
                        <table class="detail-table" id="complexity-table">
                            <thead>
                                <tr>
                                    <th>File</th>
                                    <th>Lines</th>
                                    <th>Code Lines</th>
                                    <th>Controls</th>
                                    <th>Complexity</th>
                                    <th>Avg Detection</th>
                                    <th>Runs</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <div class="timestamp-bar">
                    Analysis generated at ${new Date().toLocaleString()} · AI Syntax Diagnostic Engine
                </div>
            </div>
        `;

        // ── Render all charts ──
        renderErrorDistChart(errorCounts);
        renderPerFileChart(perFileData);
        renderTimelineChart(timelineLabels, timelineConfidence, timelineDetection);
        renderConfidenceChart(confidenceByType);
        renderFixRateChart(fixSuccessMap);
        renderHistoryTable(history);

        renderComplexityCharts(complexityGroups, perFileData, file_stats || {});
        renderComplexityTable(file_stats || {}, perFileData);
    }

    // ═══════════════════════════════════════════
    // OVERVIEW CHARTS
    // ═══════════════════════════════════════════

    // ── Error Distribution (Horizontal Bar) ──
    function renderErrorDistChart(errorCounts) {
        const labels = Object.keys(errorCounts);
        const values = Object.values(errorCounts);

        new Chart(document.getElementById('chart-error-dist'), {
            type: 'bar',
            data: {
                labels: labels.map(l => l.replace(/_/g, ' ')),
                datasets: [{
                    data: values,
                    backgroundColor: C.primaryFill,
                    borderColor: C.primary,
                    borderWidth: 1.5,
                    borderRadius: 4,
                    borderSkipped: false,
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        beginAtZero: true,
                        grid: { color: C.grid },
                        ticks: { stepSize: 1, font: { size: 11 } }
                    },
                    y: {
                        grid: { display: false },
                        ticks: { font: { size: 10, weight: '500' } }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#1e293b',
                        borderColor: '#334155',
                        borderWidth: 1,
                        titleColor: '#f1f5f9',
                        bodyColor: '#94a3b8',
                        callbacks: {
                            label: ctx => `${ctx.raw} occurrence${ctx.raw > 1 ? 's' : ''}`
                        }
                    }
                }
            }
        });
    }

    // ── Per-File Detection Time (Bar) ──
    function renderPerFileChart(perFileData) {
        const files = Object.keys(perFileData);
        const avgTimes = files.map(f => (perFileData[f].totalTime / perFileData[f].runs).toFixed(2));

        new Chart(document.getElementById('chart-per-file'), {
            type: 'bar',
            data: {
                labels: files.map(f => f.replace('.cpp', '')),
                datasets: [{
                    label: 'Avg Detection Time (ms)',
                    data: avgTimes,
                    backgroundColor: C.secondaryFill,
                    borderColor: C.secondary,
                    borderWidth: 1.5,
                    borderRadius: 4,
                    borderSkipped: false,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: C.grid },
                        ticks: { callback: v => v + 'ms', font: { size: 11 } },
                        title: { display: true, text: 'Time (ms)', color: '#64748b', font: { size: 11 } }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { font: { size: 10 }, maxRotation: 45 }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#1e293b', borderColor: '#334155', borderWidth: 1,
                        callbacks: { label: ctx => `${ctx.raw}ms avg` }
                    }
                }
            }
        });
    }

    // ── Detection Timeline (Line) ──
    function renderTimelineChart(labels, confidence, detection) {
        new Chart(document.getElementById('chart-timeline'), {
            type: 'line',
            data: {
                labels,
                datasets: [
                    {
                        label: 'Confidence (%)',
                        data: confidence,
                        borderColor: C.primary,
                        backgroundColor: C.primaryFill,
                        borderWidth: 2,
                        fill: true,
                        tension: 0.35,
                        pointRadius: 3,
                        pointHoverRadius: 6,
                        pointBackgroundColor: C.primary,
                        pointBorderColor: C.primary,
                        yAxisID: 'y',
                    },
                    {
                        label: 'Detection Time (ms)',
                        data: detection,
                        borderColor: C.secondary,
                        backgroundColor: C.secondaryFill,
                        borderWidth: 2,
                        fill: true,
                        tension: 0.35,
                        pointRadius: 3,
                        pointHoverRadius: 6,
                        pointBackgroundColor: C.secondary,
                        pointBorderColor: C.secondary,
                        yAxisID: 'y1',
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                scales: {
                    y: {
                        type: 'linear', position: 'left',
                        min: 0, max: 100,
                        grid: { color: C.grid },
                        title: { display: true, text: 'Confidence (%)', color: '#64748b', font: { size: 11 } },
                        ticks: { callback: v => v + '%', font: { size: 11 } }
                    },
                    y1: {
                        type: 'linear', position: 'right',
                        min: 0,
                        grid: { drawOnChartArea: false },
                        title: { display: true, text: 'Detection Time (ms)', color: '#64748b', font: { size: 11 } },
                        ticks: { callback: v => v.toFixed(0) + 'ms', font: { size: 11 } }
                    },
                    x: {
                        grid: { color: 'rgba(51, 65, 85, 0.2)' },
                        ticks: { font: { size: 11 } }
                    }
                },
                plugins: {
                    legend: {
                        labels: { usePointStyle: true, padding: 20, font: { size: 12, weight: '500' } }
                    },
                    tooltip: {
                        backgroundColor: '#1e293b', borderColor: '#334155', borderWidth: 1,
                    }
                }
            }
        });
    }

    // ── Confidence by Error Type (Bar) ──
    function renderConfidenceChart(confidenceByType) {
        const labels = Object.keys(confidenceByType);
        const avgs = labels.map(l => {
            const arr = confidenceByType[l];
            return arr.reduce((a,b) => a + b, 0) / arr.length;
        });

        new Chart(document.getElementById('chart-confidence'), {
            type: 'bar',
            data: {
                labels: labels.map(l => l.replace(/_/g, ' ')),
                datasets: [{
                    label: 'Avg Confidence %',
                    data: avgs,
                    backgroundColor: C.primaryFill,
                    borderColor: C.primary,
                    borderWidth: 1.5,
                    borderRadius: 4,
                    borderSkipped: false,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        min: 0, max: 100,
                        grid: { color: C.grid },
                        ticks: { callback: v => v + '%', font: { size: 11 } }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { font: { size: 10 }, maxRotation: 45 }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#1e293b', borderColor: '#334155', borderWidth: 1,
                        callbacks: { label: ctx => `${ctx.raw.toFixed(1)}% confidence` }
                    }
                }
            }
        });
    }

    // ── Fix Success Rate (Bar) ──
    function renderFixRateChart(fixSuccessMap) {
        const labels = Object.keys(fixSuccessMap);
        const rates = labels.map(l => (fixSuccessMap[l].success / fixSuccessMap[l].total * 100));

        if (labels.length === 0) {
            const el = document.getElementById('chart-fix-rate');
            el.parentElement.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:40px;font-size:13px;">No fix attempts recorded. Run with <code style="color:var(--accent-light);">--self-heal</code> flag.</p>';
            return;
        }

        new Chart(document.getElementById('chart-fix-rate'), {
            type: 'bar',
            data: {
                labels: labels.map(l => l.replace(/_/g, ' ')),
                datasets: [{
                    label: 'Success Rate %',
                    data: rates,
                    backgroundColor: C.primaryFill,
                    borderColor: C.primary,
                    borderWidth: 1.5,
                    borderRadius: 4,
                    borderSkipped: false,
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        min: 0, max: 100,
                        grid: { color: C.grid },
                        ticks: { callback: v => v + '%', font: { size: 11 } }
                    },
                    y: {
                        grid: { display: false },
                        ticks: { font: { size: 10, weight: '500' } }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#1e293b', borderColor: '#334155', borderWidth: 1,
                        callbacks: { label: ctx => `${ctx.raw.toFixed(1)}% success rate` }
                    }
                }
            }
        });
    }

    // ── History Table ──
    function renderHistoryTable(history) {
        const tbody = document.querySelector('#history-table tbody');
        let html = '';
        history.forEach((entry, i) => {
            const fixTag  = entry.fix_attempted ? '<span class="tag tag-success">YES</span>' : '<span class="tag tag-info">NO</span>';
            const compTag = entry.fix_compiled ? '<span class="tag tag-success">✓</span>' : (entry.fix_attempted ? '<span class="tag tag-error">✗</span>' : '—');

            html += `<tr>
                <td style="color:var(--text-muted);">${i + 1}</td>
                <td style="font-size:12px;font-weight:500;">${entry.filename || '—'}</td>
                <td><span class="tag tag-info">${(entry.error_type || 'UNKNOWN').replace(/_/g, ' ')}</span></td>
                <td style="font-weight:600;">${entry.confidence.toFixed(1)}%</td>
                <td>${(entry.detection_time * 1000).toFixed(1)}ms</td>
                <td>${fixTag}</td>
                <td>${compTag}</td>
            </tr>`;
        });
        tbody.innerHTML = html;
    }

    // ═══════════════════════════════════════════
    // COMPLEXITY CHARTS
    // ═══════════════════════════════════════════

    function renderComplexityCharts(groups, perFileData, fileStats) {
        const levels = ['simple', 'medium', 'complex'];
        const levelLabels = ['Simple', 'Medium', 'Complex'];
        const levelColors = [C.primary, C.secondary, C.muted];
        const levelFills  = [C.primaryFill, C.secondaryFill, C.mutedFill];

        // Compute averages per complexity level
        const avgTime = levels.map(lvl => {
            const entries = groups[lvl];
            if (!entries || entries.length === 0) return 0;
            return entries.reduce((sum, e) => sum + e.detection_time * 1000, 0) / entries.length;
        });

        const avgConf = levels.map(lvl => {
            const entries = groups[lvl];
            if (!entries || entries.length === 0) return 0;
            return entries.reduce((sum, e) => sum + e.confidence, 0) / entries.length;
        });

        const fixRate = levels.map(lvl => {
            const entries = groups[lvl];
            if (!entries || entries.length === 0) return 0;
            const attempted = entries.filter(e => e.fix_attempted);
            if (attempted.length === 0) return 0;
            return (attempted.filter(e => e.fix_compiled).length / attempted.length) * 100;
        });

        // Chart: Avg Detection Time by Complexity
        new Chart(document.getElementById('chart-cx-time'), {
            type: 'bar',
            data: {
                labels: levelLabels,
                datasets: [{
                    data: avgTime.map(v => v.toFixed(2)),
                    backgroundColor: levelFills,
                    borderColor: levelColors,
                    borderWidth: 1.5,
                    borderRadius: 6,
                    borderSkipped: false,
                    barPercentage: 0.5,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: C.grid },
                        ticks: { callback: v => v + 'ms', font: { size: 11 } },
                        title: { display: true, text: 'Time (ms)', color: '#64748b', font: { size: 11 } }
                    },
                    x: { grid: { display: false }, ticks: { font: { size: 12, weight: '600' } } }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: { backgroundColor: '#1e293b', borderColor: '#334155', borderWidth: 1 }
                }
            }
        });

        // Chart: Avg Confidence by Complexity
        new Chart(document.getElementById('chart-cx-conf'), {
            type: 'bar',
            data: {
                labels: levelLabels,
                datasets: [{
                    data: avgConf.map(v => v.toFixed(1)),
                    backgroundColor: levelFills,
                    borderColor: levelColors,
                    borderWidth: 1.5,
                    borderRadius: 6,
                    borderSkipped: false,
                    barPercentage: 0.5,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        min: 0, max: 100,
                        grid: { color: C.grid },
                        ticks: { callback: v => v + '%', font: { size: 11 } },
                        title: { display: true, text: 'Confidence (%)', color: '#64748b', font: { size: 11 } }
                    },
                    x: { grid: { display: false }, ticks: { font: { size: 12, weight: '600' } } }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: { backgroundColor: '#1e293b', borderColor: '#334155', borderWidth: 1 }
                }
            }
        });

        // Chart: Fix Success Rate by Complexity (horizontal bar)
        new Chart(document.getElementById('chart-cx-fix'), {
            type: 'bar',
            data: {
                labels: levelLabels,
                datasets: [{
                    label: 'Fix Success Rate',
                    data: fixRate.map(v => v.toFixed(1)),
                    backgroundColor: levelFills,
                    borderColor: levelColors,
                    borderWidth: 1.5,
                    borderRadius: 6,
                    borderSkipped: false,
                    barPercentage: 0.4,
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        min: 0, max: 100,
                        grid: { color: C.grid },
                        ticks: { callback: v => v + '%', font: { size: 11 } }
                    },
                    y: { grid: { display: false }, ticks: { font: { size: 12, weight: '600' } } }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: { backgroundColor: '#1e293b', borderColor: '#334155', borderWidth: 1 }
                }
            }
        });

        // Chart: Per-File grouped bar (detection time + confidence)
        const files = Object.keys(perFileData);
        const fileAvgTime = files.map(f => (perFileData[f].totalTime / perFileData[f].runs).toFixed(2));
        const fileAvgConf = files.map(f => (perFileData[f].totalConf / perFileData[f].runs).toFixed(1));

        new Chart(document.getElementById('chart-cx-files'), {
            type: 'bar',
            data: {
                labels: files.map(f => f.replace('.cpp', '')),
                datasets: [
                    {
                        label: 'Avg Detection Time (ms)',
                        data: fileAvgTime,
                        backgroundColor: C.primaryFill,
                        borderColor: C.primary,
                        borderWidth: 1.5,
                        borderRadius: 4,
                        yAxisID: 'y',
                    },
                    {
                        label: 'Avg Confidence (%)',
                        data: fileAvgConf,
                        backgroundColor: C.secondaryFill,
                        borderColor: C.secondary,
                        borderWidth: 1.5,
                        borderRadius: 4,
                        yAxisID: 'y1',
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        position: 'left',
                        beginAtZero: true,
                        grid: { color: C.grid },
                        ticks: { callback: v => v + 'ms', font: { size: 11 } },
                        title: { display: true, text: 'Detection (ms)', color: '#64748b', font: { size: 11 } }
                    },
                    y1: {
                        position: 'right',
                        min: 0, max: 100,
                        grid: { drawOnChartArea: false },
                        ticks: { callback: v => v + '%', font: { size: 11 } },
                        title: { display: true, text: 'Confidence (%)', color: '#64748b', font: { size: 11 } }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { font: { size: 10 }, maxRotation: 45 }
                    }
                },
                plugins: {
                    legend: {
                        labels: { usePointStyle: true, padding: 16, font: { size: 11, weight: '500' } }
                    },
                    tooltip: { backgroundColor: '#1e293b', borderColor: '#334155', borderWidth: 1 }
                }
            }
        });

        // Chart: Line count vs detection time (line chart plot)
        const scatterData = [];
        const scatterLabels = [];
        files.forEach(f => {
            const stats = fileStats[f];
            if (stats) {
                scatterData.push({
                    lines: stats.code_lines,
                    time: parseFloat((perFileData[f].totalTime / perFileData[f].runs).toFixed(2)),
                    name: f
                });
            }
        });
        // Sort by line count
        scatterData.sort((a, b) => a.lines - b.lines);

        new Chart(document.getElementById('chart-cx-scatter'), {
            type: 'line',
            data: {
                labels: scatterData.map(d => d.name.replace('.cpp', '') + ' (' + d.lines + ' lines)'),
                datasets: [{
                    label: 'Detection Time (ms)',
                    data: scatterData.map(d => d.time),
                    borderColor: C.primary,
                    backgroundColor: C.primaryFill,
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3,
                    pointRadius: 5,
                    pointHoverRadius: 8,
                    pointBackgroundColor: C.primary,
                    pointBorderColor: '#0f172a',
                    pointBorderWidth: 2,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: C.grid },
                        ticks: { callback: v => v + 'ms', font: { size: 11 } },
                        title: { display: true, text: 'Detection Time (ms)', color: '#64748b', font: { size: 11 } }
                    },
                    x: {
                        grid: { color: 'rgba(51, 65, 85, 0.2)' },
                        ticks: { font: { size: 9 }, maxRotation: 45 }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#1e293b', borderColor: '#334155', borderWidth: 1,
                        callbacks: {
                            title: ctx => scatterData[ctx[0].dataIndex].name,
                            label: ctx => `${ctx.raw}ms (${scatterData[ctx.dataIndex].lines} code lines)`
                        }
                    }
                }
            }
        });
    }

    // ── Complexity Table ──
    function renderComplexityTable(fileStats, perFileData) {
        const tbody = document.querySelector('#complexity-table tbody');
        let html = '';
        const sortedFiles = Object.keys(fileStats).sort((a, b) => fileStats[a].code_lines - fileStats[b].code_lines);

        sortedFiles.forEach(f => {
            const s = fileStats[f];
            const pf = perFileData[f];
            const avgTime = pf ? (pf.totalTime / pf.runs).toFixed(1) + 'ms' : '—';
            const runs = pf ? pf.runs : 0;

            const cxClass = s.complexity === 'simple' ? 'tag-success' : s.complexity === 'medium' ? 'tag-warning' : 'tag-error';

            html += `<tr>
                <td style="font-size:12px;font-weight:500;">${f}</td>
                <td>${s.lines}</td>
                <td>${s.code_lines}</td>
                <td>${s.controls}</td>
                <td><span class="tag ${cxClass}">${s.complexity.toUpperCase()}</span></td>
                <td>${avgTime}</td>
                <td>${runs}</td>
            </tr>`;
        });
        tbody.innerHTML = html;
    }

    // ── Init ──
    loadPerformanceData();
</script>

</body>
</html>
