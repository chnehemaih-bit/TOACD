<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Syntax Diagnostic Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #fafbfc;
            color: #24292e;
            font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            font-size: 14px;
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* ── MAIN CONTAINER ── */
        .terminal-wrap {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05), 0 1px 4px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e1e4e8;
        }

        /* ── MINIMAL TOP HEADER ── */
        .top-bar {
            background: #ffffff;
            border-bottom: 1px solid #e1e4e8;
            padding: 0 16px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: relative;
        }

        .top-bar::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #0366d6, #28a745);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-bar-dot {
            width: 8px;
            height: 8px;
            background: #28a745;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(40, 167, 69, 0.2);
        }

        .top-bar-title {
            font-size: 13px;
            font-weight: 600;
            color: #24292e;
            letter-spacing: 0.02em;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .perf-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid #e1e4e8;
            background: #f6f8fa;
            color: #586069;
            font-size: 12px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .perf-btn:hover {
            background: #0366d6;
            color: #fff;
            border-color: #0366d6;
            box-shadow: 0 2px 8px rgba(3, 102, 214, 0.2);
        }

        .perf-btn svg {
            width: 14px;
            height: 14px;
        }

        /* ── TERMINAL BODY ── */
        #terminal-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        /* ── WELCOME BLOCK ── */
        .welcome-block {
            margin-bottom: 24px;
        }

        .welcome-title {
            font-size: 15px;
            font-weight: 700;
            color: #0366d6;
            margin-bottom: 4px;
        }

        .welcome-hint {
            font-size: 13px;
            color: #6a737d;
        }

        .welcome-hint code {
            background: #f6f8fa;
            border: 1px solid #eaecef;
            padding: 2px 6px;
            border-radius: 3px;
            color: #24292e;
            font-family: inherit;
        }

        /* ── DIVIDER ── */
        .term-divider {
            border: none;
            border-top: 1px dashed #eaecef;
            margin: 16px 0;
        }

        /* ── OUTPUT LINES ── */
        #history { display: flex; flex-direction: column; gap: 4px; }

        .output-line {
            white-space: pre-wrap;
            color: #24292e;
            font-size: 13.5px;
        }

        .command-line {
            color: #0366d6;
            font-weight: 600;
            margin-top: 8px;
        }

        .error-line  { color: #cb2431; }
        .muted-line  { color: #6a737d; font-size: 12.5px; }

        /* result highlights */
        .output-line.result-block {
            background: #f6f8fa;
            border: 1px solid #eaecef;
            border-left: 3px solid #0366d6;
            padding: 12px 16px;
            margin: 8px 0;
            border-radius: 3px;
        }

        /* Performance link after output */
        .perf-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #0366d6;
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 4px;
            transition: all 0.2s;
            margin-top: 4px;
            cursor: pointer;
        }

        .perf-link:hover {
            background: rgba(3, 102, 214, 0.08);
            text-decoration: underline;
        }

        /* ── INPUT LINE ── */
        .input-line {
            display: flex;
            align-items: center;
            margin-top: 12px;
            gap: 10px;
        }

        .prompt {
            color: #0366d6;
            font-weight: 700;
            font-size: 14px;
            user-select: none;
        }

        .cursor-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
            position: relative;
        }

        #cmd-input {
            flex-grow: 1;
            border: none;
            outline: none;
            background: transparent;
            color: #24292e;
            font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 0;
            margin: 0;
            caret-color: #0366d6;
        }

        #cmd-input::placeholder {
            color: #babbbd;
        }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar       { width: 8px; }
        ::-webkit-scrollbar-track { background: #fafbfc; }
        ::-webkit-scrollbar-thumb { background: #d1d5da; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #959da5; }

    </style>
</head>
<body>

<div class="terminal-wrap">
    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="top-bar-left">
            <div class="top-bar-dot"></div>
            <div class="top-bar-title">AI Syntax Diagnostics</div>
        </div>
        <div class="top-bar-right">
            <a href="/performance" class="perf-btn" id="perf-nav-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"></line>
                    <line x1="12" y1="20" x2="12" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>
                Performance
            </a>
        </div>
    </div>

    <!-- TERMINAL -->
    <div id="terminal-container">

        <div class="welcome-block">
            <div class="welcome-title">Diagnostic Terminal</div>
            <div class="welcome-hint">
                Type a <code>.cpp</code> filename (e.g. <code>test_missing_semicolon.cpp [--self-heal]</code>) and press Enter to run diagnostic.<br>
                Type <code>clear</code> to reset terminal. Click <strong>Performance</strong> to view analysis graphs.
            </div>
        </div>

        <hr class="term-divider"/>

        <div id="history"></div>

        <div class="input-line">
            <span class="prompt">❯</span>
            <div class="cursor-wrapper">
                <input type="text" id="cmd-input" autocomplete="off" spellcheck="false" autofocus placeholder="enter filename...">
            </div>
        </div>
    </div>
</div>

<script>
    const inputField       = document.getElementById('cmd-input');
    const historyDiv       = document.getElementById('history');
    const terminalContainer= document.getElementById('terminal-container');

    document.addEventListener('click', () => inputField.focus());

    function scrollDown() {
        terminalContainer.scrollTop = terminalContainer.scrollHeight;
    }

    function appendLine(text, className = 'output-line') {
        const div = document.createElement('div');
        div.className = className;
        div.textContent = text;
        historyDiv.appendChild(div);
        scrollDown();
        return div;
    }

    function addDivider() {
        const hr = document.createElement('hr');
        hr.className = 'term-divider';
        historyDiv.appendChild(hr);
        scrollDown();
    }

    function addPerfLink() {
        const a = document.createElement('a');
        a.className = 'perf-link';
        a.href = '/performance';
        a.innerHTML = '📊 View Performance Analysis →';
        historyDiv.appendChild(a);
        scrollDown();
    }

    async function runCommand(cmd) {
        const commandText = cmd.trim();
        if (!commandText) return;

        appendLine(`❯ ${commandText}`, 'command-line');

        if (commandText.toLowerCase() === 'clear') {
            historyDiv.innerHTML = '';
            return;
        }

        // show loading
        const loadingDiv = appendLine('Analyzing source code...', 'muted-line');

        try {
            const response = await fetch('/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: commandText })
            });

            const data = await response.json();
            
            loadingDiv.remove();

            if (data.output) {
                let outText = data.output;
                if (!outText.endsWith('\n')) outText += '\n';
                appendLine(outText, 'output-line result-block');
            } else {
                appendLine('No output returned.', 'error-line');
            }

            // Add performance link after each successful run
            addPerfLink();

        } catch (error) {
            loadingDiv.remove();
            appendLine(`Connection error: ${error.message}`, 'error-line');
            appendLine('Make sure python3 server.py is running on localhost.', 'muted-line');
        }

        addDivider();
    }

    inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const cmd = this.value;
            this.value = '';
            runCommand(cmd);
        }
    });
</script>

</body>
</html>
